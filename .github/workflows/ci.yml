name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }}, ${{ matrix.dependencies }} dependencies)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        dependencies: [highest]
        include:
          - php: '8.4'
            dependencies: lowest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # gd builds the JPEG, GIF and WebP fixtures; zip reads packages back.
          extensions: dom, mbstring, xmlwriter, zlib, zip, gd
          coverage: none

      - uses: ramsey/composer-install@4.0.0
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - run: composer test

  static-analysis:
    name: Static analysis and code style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, mbstring, xmlwriter, zlib, zip
          coverage: none

      - uses: ramsey/composer-install@4.0.0

      - run: composer validate --strict
      - run: composer analyse
      - run: composer lint

  examples:
    name: Examples are what the library writes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, mbstring, xmlwriter, zlib, zip
          coverage: none

      - uses: ramsey/composer-install@4.0.0

      # examples/build.php is reproducible; Word's own files are not touched.
      - run: php examples/build.php
      - name: Rebuild examples/build-word.sh on macOS when this fails
        run: git diff --exit-code -- examples
